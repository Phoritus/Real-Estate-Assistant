# fly.toml app configuration file generated for real-estate-backend12 on 2025-11-17T04:57:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'real-estate-backend12'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[checks]]
  type = "http"
  name = "health"
  interval = "10s"
  timeout = "2s"
  grace_period = "20s"
  method = "get"
  path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
